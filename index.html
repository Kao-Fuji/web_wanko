
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>わんこそば連打ゲーム</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --paper: #fff4cf;
      --paper-strong: #ffe29a;
      --brown: #5a3518;
      --brown-dark: #2b1709;
      --accent: #ffb340;
      --sky: #d8f2ff;
      --success-blue: rgba(76, 124, 255, 0.16);
      --success-line: #4b7cff;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      color: var(--brown-dark);
      background: #222;
      font-family: "Yu Gothic UI", "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
    }

    button {
      border: 3px solid rgba(90, 53, 24, 0.48);
      border-radius: 0;
      padding: 10px 20px;
      color: #090603;
      background: var(--paper);
      font: inherit;
      font-size: 20px;
      font-weight: 800;
      cursor: pointer;
      touch-action: manipulation;
      box-shadow: 3px 3px 0 rgba(90, 53, 24, 0.42);
    }

    button:hover {
      background: var(--paper-strong);
    }

    img[hidden],
    .hidden {
      display: none !important;
    }

    .app-shell {
      position: relative;
      width: min(100vw, 1000px);
      height: min(100vh, 700px);
      min-height: 700px;
      margin: 0 auto;
      overflow: hidden;
      background: #ddd;
    }

    .screen {
      position: absolute;
      inset: 0;
      display: none;
      overflow: hidden;
    }

    .screen.active {
      display: block;
    }

    .screen-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .screen-shade {
      position: absolute;
      inset: 0;
      background: rgba(20, 10, 0, 0.28);
    }

    .screen-shade.light {
      background: rgba(20, 10, 0, 0.14);
    }

    .screen-shade.strong {
      background: rgba(15, 5, 0, 0.46);
    }

    .title-content {
      position: relative;
      z-index: 2;
      display: grid;
      justify-items: center;
      padding-top: 34px;
      text-align: center;
    }

    .title-content h1,
    .screen-title {
      margin: 0;
      color: #fff1c8;
      text-shadow:
        3px 3px 0 var(--brown-dark),
        -1px -1px 0 var(--brown-dark),
        1px -1px 0 var(--brown-dark),
        -1px 1px 0 var(--brown-dark);
    }

    .title-content h1 {
      font-size: clamp(44px, 7vw, 72px);
      line-height: 1.04;
    }

    .title-content p {
      margin: 14px 0 9px;
      color: #fff1c8;
      font-size: clamp(15px, 2.2vw, 21px);
      font-weight: 800;
      text-shadow: 2px 2px 0 var(--brown-dark);
    }

    .age-panel {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: min(330px, 78vw);
      margin: 7px 0;
      padding: 9px 14px;
      border: 3px solid var(--brown);
      background: var(--paper);
      font-size: 19px;
      font-weight: 800;
    }

    .age-panel input {
      width: 92px;
      padding: 6px 8px;
      border: 2px solid var(--brown);
      font-size: 19px;
      font-weight: 800;
      text-align: center;
    }

    .menu-panel {
      display: grid;
      gap: 8px;
      width: min(330px, 78vw);
      padding: 11px;
      background: rgba(255, 203, 99, 0.78);
    }

    .ai-data-buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      width: min(520px, 90vw);
      margin-top: 9px;
    }

    .ai-data-buttons button {
      padding: 7px 11px;
      font-size: 13px;
    }

    .ai-note {
      margin-top: 6px !important;
      color: #fff1c8 !important;
      font-size: 12px !important;
      font-weight: 800 !important;
      text-shadow: 1px 1px 0 var(--brown-dark) !important;
    }

    .screen-title {
      position: relative;
      z-index: 3;
      margin-top: 36px;
      text-align: center;
      font-size: clamp(34px, 5vw, 48px);
    }

    .guide-image {
      position: absolute;
      z-index: 3;
      top: 17%;
      right: 4%;
      width: min(34%, 340px);
      height: min(68%, 470px);
      object-fit: contain;
      object-position: center bottom;
    }

    .practice-card {
      position: absolute;
      z-index: 4;
      top: 45%;
      left: 13%;
      width: min(570px, 62%);
      padding: 18px;
      border: 3px solid var(--brown);
      background: var(--paper);
      font-size: clamp(16px, 2.2vw, 21px);
      font-weight: 800;
    }

    .practice-card p {
      margin: 0;
    }

    .bottom-buttons {
      position: absolute;
      z-index: 5;
      bottom: 9%;
      left: 50%;
      display: grid;
      gap: 14px;
      width: min(240px, 52vw);
      transform: translateX(-50%);
    }

    .game-hud {
      position: absolute;
      z-index: 7;
      top: 10px;
      left: 55%;
      width: min(530px, 56%);
      padding: 8px 16px;
      border: 3px solid var(--brown);
      background: var(--paper);
      transform: translateX(-50%);
    }

    .hud-top-row,
    .time-row {
      display: flex;
      align-items: center;
      gap: 16px;
      font-weight: 800;
    }

    .hud-top-row {
      justify-content: space-between;
      margin-bottom: 5px;
      font-size: 18px;
    }

    .time-row {
      font-size: 16px;
    }

    .effect-label {
      margin-top: 4px;
      font-size: 14px;
      font-weight: 800;
    }

    .time-bar {
      flex: 1;
      height: 20px;
      border: 2px solid var(--brown);
      overflow: hidden;
      background: #d8c99b;
    }

    .time-bar-fill {
      width: 100%;
      height: 100%;
      background: var(--accent);
      transition: width 0.1s linear;
    }

    .left-bowl-panel {
      position: absolute;
      z-index: 4;
      top: 20px;
      bottom: 22px;
      left: 14px;
      width: 265px;
      border: 3px solid var(--brown);
      overflow: hidden;
      background: var(--paper);
    }

    .left-bowl-panel h3 {
      margin: 12px 0 5px;
      text-align: center;
      font-size: 24px;
    }

    .left-bowl-stack {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      align-content: start;
      gap: 6px;
      padding: 12px;
    }

    .bowl-slot {
      display: grid;
      place-items: center;
      width: 74px;
      height: 52px;
      overflow: hidden;
      font-size: 30px;
    }

    .bowl-slot img {
      width: 74px;
      height: 50px;
      object-fit: contain;
    }

    .game-main-area {
      position: absolute;
      z-index: 5;
      top: 108px;
      right: 260px;
      bottom: 0;
      left: 285px;
    }

    .speech-card {
      position: absolute;
      top: 0;
      left: 50%;
      width: 380px;
      min-height: 92px;
      padding: 13px 18px;
      border: 3px solid var(--brown);
      background: var(--paper);
      transform: translateX(-50%);
    }

    .speech-card p {
      margin: 0;
      white-space: pre-line;
      font-size: 18px;
      font-weight: 800;
    }

    .food-stage {
      position: absolute;
      top: 150px;
      left: 50%;
      display: grid;
      place-items: center;
      width: 450px;
      height: 270px;
      overflow: visible;
      transform: translateX(-50%);
    }

    .current-item-image {
      display: block;
      width: 450px;
      height: 290px;
      object-fit: contain;
      object-position: center bottom;
    }

    .item-fallback {
      display: grid;
      place-items: center;
      width: 280px;
      height: 165px;
      border: 3px solid var(--brown);
      background: var(--paper);
      font-size: 30px;
      font-weight: 800;
    }

    .click-progress {
      position: absolute;
      top: 420px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 34px;
      font-weight: 900;
      text-shadow: 1px 1px 0 #fff1c8;
    }

    .game-buttons {
      position: absolute;
      top: 472px;
      left: 50%;
      display: grid;
      gap: 11px;
      width: 290px;
      transform: translateX(-50%);
    }

    .game-buttons button {
      width: 100%;
    }

    .waiter-image {
      position: absolute;
      z-index: 4;
      top: 188px;
      right: -28px;
      width: 315px;
      height: 440px;
      object-fit: contain;
      object-position: center;
      transform: rotate(90deg);
      transform-origin: center center;
    }

    .floating-message {
      position: absolute;
      z-index: 10;
      top: 145px;
      left: 50%;
      width: min(430px, 72%);
      padding: 12px;
      border: 3px solid var(--brown);
      background: var(--paper);
      text-align: center;
      font-size: 17px;
      font-weight: 800;
      transform: translateX(-50%);
    }

    .countdown-screen {
      display: none;
      place-items: center;
      background: rgba(0, 0, 0, 0.84);
    }

    .countdown-screen.active {
      display: grid;
    }

    .countdown-number {
      color: #fff;
      font-size: min(30vw, 170px);
      font-weight: 900;
    }

    .minigame-screen {
      background: var(--sky);
    }

    .minigame-screen.active {
      display: block;
    }

    #minigame-canvas {
      width: 100%;
      height: 100%;
    }

    .drop-button {
      position: absolute;
      bottom: 25px;
      left: 50%;
      width: min(320px, 68vw);
      transform: translateX(-50%);
      font-size: 22px;
    }

    .result-card,
    .ranking-card {
      position: relative;
      z-index: 3;
      width: min(680px, 91%);
      margin: 50px auto 0;
      padding: 23px;
      border: 4px solid var(--brown);
      background: var(--paper);
      text-align: center;
    }

    .result-card h2,
    .ranking-card h2 {
      margin: 0 0 14px;
      font-size: 39px;
    }

    .result-card p {
      white-space: pre-line;
      font-size: 19px;
      font-weight: 800;
    }

    .result-buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-top: 19px;
    }

    .ranking-note {
      margin-top: -8px;
      font-size: 14px;
      font-weight: 700;
    }

    .ranking-list {
      min-height: 305px;
      margin: 18px auto;
      padding-left: 2.2em;
      text-align: left;
      font-size: 18px;
      font-weight: 800;
    }

    .ranking-list li {
      padding: 4px 8px;
    }

    @media (max-width: 720px) {
      .app-shell {
        min-height: 760px;
      }

      .title-content {
        padding-top: 40px;
      }

      .title-content h1 {
        font-size: 52px;
      }

      .practice-card {
        top: 45%;
        left: 5%;
        width: 72%;
      }

      .guide-image {
        top: 18%;
        right: 0;
        width: 40%;
      }

      .game-hud {
        top: 8px;
        left: 60%;
        width: 77%;
        padding: 7px 11px;
      }

      .hud-top-row {
        font-size: 15px;
      }

      .left-bowl-panel {
        top: 100px;
        left: 6px;
        width: 136px;
      }

      .left-bowl-panel h3 {
        font-size: 20px;
      }

      .left-bowl-stack {
        grid-template-columns: repeat(2, 1fr);
        gap: 4px;
        padding: 7px;
      }

      .bowl-slot {
        width: 58px;
        height: 43px;
      }

      .bowl-slot img {
        width: 58px;
        height: 41px;
      }

      .game-main-area {
        top: 145px;
        right: 6px;
        left: 145px;
      }

      .speech-card {
        width: 95%;
        min-height: 78px;
      }

      .speech-card p {
        font-size: 15px;
      }

      .food-stage {
        top: 142px;
        width: 95%;
        height: 245px;
      }

      .current-item-image {
        width: 100%;
        height: 255px;
      }

      .click-progress {
        top: 390px;
        font-size: 31px;
      }

      .game-buttons {
        top: 440px;
        width: 220px;
      }

      .waiter-image {
        top: 235px;
        right: -24px;
        width: 185px;
        height: 295px;
        transform: rotate(90deg);
      }

      .result-card,
      .ranking-card {
        margin-top: 37px;
        padding: 16px;
      }

      .result-card h2,
      .ranking-card h2 {
        font-size: 34px;
      }

      .result-card p {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>
  <main class="app-shell">

    <section id="title-screen" class="screen active">
      <img class="screen-bg" data-asset="background" alt="">
      <div class="screen-shade"></div>

      <div class="title-content">
        <h1>わんこそば<br>連打ゲーム</h1>

        <p>食べる？ 食べない？ お椀が積もれば時間も積もる。</p>

        <div class="age-panel">
          <label for="actual-age-input">実年齢</label>
          <input id="actual-age-input" type="number" min="5" max="99" inputmode="numeric" placeholder="例：21">
        </div>

        <div class="menu-panel">
          <button id="practice-menu-button">練習モード</button>
          <button id="real-menu-button">本番モード</button>
          <button id="ranking-menu-button">ランキング</button>
        </div>

        <div class="ai-data-buttons">
          <button id="download-ai-data-button">AI学習用CSVを保存</button>
          <button id="clear-ai-data-button">AI記録を削除</button>
        </div>

        <p class="ai-note">
          本番モードでは、AIが反応時間・正解率・ミス回数を分析します。
        </p>
      </div>
    </section>

    <section id="practice-screen" class="screen">
      <img class="screen-bg" data-asset="background" alt="">
      <div class="screen-shade light"></div>

      <h2 class="screen-title">練習説明</h2>

      <img class="guide-image" data-asset="guide" alt="案内役">

      <div class="practice-card">
        <p id="practice-message"></p>
      </div>

      <div class="bottom-buttons">
        <button id="practice-next-button">次へ</button>
        <button id="practice-back-button">タイトルへ</button>
      </div>
    </section>

    <section id="game-screen" class="screen">
      <img class="screen-bg" data-asset="background" alt="">
      <div class="screen-shade light"></div>

      <div class="game-hud">
        <div class="hud-top-row">
          <span id="mode-label">モード: 練習</span>
          <span id="bowl-count-label">杯数: 0</span>
        </div>

        <div class="time-row">
          <span id="time-label">残り 10 秒</span>
          <div class="time-bar">
            <div id="time-bar-fill" class="time-bar-fill"></div>
          </div>
        </div>

        <div id="effect-label" class="effect-label">効果: なし</div>
      </div>

      <aside class="left-bowl-panel">
        <h3>お椀</h3>
        <div id="left-bowl-stack" class="left-bowl-stack"></div>
      </aside>

      <div class="game-main-area">
        <div class="speech-card">
          <p id="speech-text">次の食べ物を準備中...</p>
        </div>

        <div class="food-stage">
          <img id="current-item-image" class="current-item-image" alt="">
          <div id="item-fallback" class="item-fallback hidden"></div>
        </div>

        <div id="click-progress" class="click-progress">0 / 1</div>

        <div class="game-buttons">
          <button id="eat-button">食べる</button>
          <button id="skip-button">食べない</button>
        </div>
      </div>

      <img class="waiter-image" data-asset="waiter" alt="学部長">

      <div id="floating-message" class="floating-message hidden"></div>
    </section>

    <section id="countdown-screen" class="screen countdown-screen">
      <div id="countdown-number" class="countdown-number">3</div>
    </section>

    <section id="minigame-screen" class="screen minigame-screen">
      <canvas id="minigame-canvas" width="1000" height="700"></canvas>
      <button id="drop-button" class="drop-button">落とす</button>
    </section>

    <section id="result-screen" class="screen">
      <img class="screen-bg" data-asset="background" alt="">
      <div class="screen-shade strong"></div>

      <div class="result-card">
        <h2>結果発表</h2>
        <p id="result-message"></p>

        <div class="result-buttons">
          <button id="retry-button">もう一度</button>
          <button id="result-ranking-button">ランキング</button>
          <button id="result-title-button">タイトル</button>
        </div>
      </div>
    </section>

    <section id="ranking-screen" class="screen">
      <img class="screen-bg" data-asset="background" alt="">
      <div class="screen-shade strong"></div>

      <div class="ranking-card">
        <h2>ランキング</h2>
        <p class="ranking-note">この端末で遊んだ本番モードの記録</p>
        <ol id="ranking-list" class="ranking-list"></ol>
        <button id="ranking-back-button">タイトルへ</button>
      </div>
    </section>

  </main>

  <script>
    "use strict";

    const SETTINGS = {
      practiceSeconds: 10,
      realSeconds: 30,
      countdownSeconds: 3,
      effectTurns: 5,
      bowlsToTriggerMinigame: 10,
      minigameBowls: 10,

      /*
        ミニゲーム成功範囲。
        中心線から左右54px。
        青い範囲内にお椀の中心が入れば成功。
      */
      minigameGoodRange: 54,

      /*
        お椀1個ごとにランダム選択される横移動速度。
      */
      minigameSpeedChoices: [
        2.5,
        3,
        3.5,
        4,
        4.5,
        5,
        5.5,
        6,
      ],

      minigameDropSpeed: 14,
      rankingKey: "wankosoba-ranking-v1",
      aiStorageKey: "wankosoba-ai-records-v1",
    };

    const ITEMS = [
      {
        key: "soba",
        name: "そば",
        category: "noodle",
        clicks: 1,
        weight: 25,
      },
      {
        key: "udon",
        name: "うどん",
        category: "noodle",
        clicks: 3,
        weight: 18,
      },
      {
        key: "ramen",
        name: "中華麺",
        category: "noodle",
        clicks: 5,
        weight: 14,
      },
      {
        key: "houtou",
        name: "ほうとう",
        category: "noodle",
        clicks: 10,
        weight: 8,
      },
      {
        key: "dark_matter",
        name: "ダークマター",
        category: "bad",
        penalty: "gameOver",
        weight: 6,
      },
      {
        key: "rock",
        name: "岩",
        category: "bad",
        penalty: "minusBowls",
        weight: 7,
      },
      {
        key: "rock_salt",
        name: "岩塩",
        category: "effect",
        effectType: "multiply",
        effectValue: 2,
        weight: 7,
      },
      {
        key: "moss",
        name: "苔",
        category: "effect",
        effectType: "multiply",
        effectValue: 3,
        weight: 5,
      },
      {
        key: "yakumi",
        name: "薬味",
        category: "effect",
        effectType: "oneClick",
        effectValue: 1,
        weight: 10,
      },
    ];

    const ASSET_CANDIDATES = {
      background: ["background"],
      bowl: ["bowl_transparent", "bowl"],
      waiter: ["waiter_transparent", "waiter"],
      guide: ["guide_transparent", "guide"],
      soba: ["soba_transparent", "soba"],
      udon: ["udon_transparent", "udon"],
      ramen: ["ramen_transparent", "ramen"],
      houtou: ["houtou_transparent", "houtou"],
      dark_matter: ["dark_matter_transparent", "dark_matter"],
      rock: ["rock_transparent", "rock"],
      rock_salt: ["rock_salt_transparent", "rock_salt"],
      moss: ["moss_transparent", "moss"],
      yakumi: ["yakumi_transparent", "yakumi"],
    };

    const ASSET_EXTENSIONS = [
      ".png",
      ".jpg",
      ".jpeg",
      ".webp",
    ];

    const rawImageCache = new Map();
    const processedImageCache = new Map();

    function makeAssetPaths(key) {
      const names = ASSET_CANDIDATES[key] ?? [key];
      const paths = [];

      for (const name of names) {
        for (const extension of ASSET_EXTENSIONS) {
          paths.push(`${name}${extension}`);
        }
      }

      return paths;
    }

    function loadRawImage(key) {
      if (rawImageCache.has(key)) {
        return rawImageCache.get(key);
      }

      const promise = new Promise((resolve) => {
        const paths = makeAssetPaths(key);
        let index = 0;

        const tryNext = () => {
          if (index >= paths.length) {
            resolve(null);
            return;
          }

          const image = new Image();

          image.onload = () => {
            resolve(image);
          };

          image.onerror = tryNext;
          image.src = paths[index];
          index += 1;
        };

        tryNext();
      });

      rawImageCache.set(key, promise);
      return promise;
    }

    /*
      白背景の自動透過。
      画像の端からつながっている白い部分だけを消す。
    */
    function removeConnectedWhiteBackground(image) {
      const maxSide = 1400;
      const scale = Math.min(
        1,
        maxSide / Math.max(image.naturalWidth, image.naturalHeight),
      );

      const width = Math.max(1, Math.round(image.naturalWidth * scale));
      const height = Math.max(1, Math.round(image.naturalHeight * scale));

      const canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = height;

      const context = canvas.getContext(
        "2d",
        {
          willReadFrequently: true,
        },
      );

      context.drawImage(image, 0, 0, width, height);

      const imageData = context.getImageData(0, 0, width, height);
      const pixels = imageData.data;

      const visited = new Uint8Array(width * height);
      const queue = new Int32Array(width * height);

      let head = 0;
      let tail = 0;

      const isNearWhite = (pixelIndex) => {
        const offset = pixelIndex * 4;
        const red = pixels[offset];
        const green = pixels[offset + 1];
        const blue = pixels[offset + 2];
        const alpha = pixels[offset + 3];

        const brightest = Math.max(red, green, blue);
        const darkest = Math.min(red, green, blue);

        return (
          alpha > 0
          && red >= 232
          && green >= 232
          && blue >= 232
          && brightest - darkest <= 42
        );
      };

      const enqueue = (pixelIndex) => {
        if (
          pixelIndex < 0
          || pixelIndex >= width * height
          || visited[pixelIndex]
          || !isNearWhite(pixelIndex)
        ) {
          return;
        }

        visited[pixelIndex] = 1;
        queue[tail] = pixelIndex;
        tail += 1;
      };

      for (let x = 0; x < width; x += 1) {
        enqueue(x);
        enqueue((height - 1) * width + x);
      }

      for (let y = 0; y < height; y += 1) {
        enqueue(y * width);
        enqueue(y * width + width - 1);
      }

      while (head < tail) {
        const pixelIndex = queue[head];
        head += 1;

        pixels[pixelIndex * 4 + 3] = 0;

        const x = pixelIndex % width;
        const y = Math.floor(pixelIndex / width);

        if (x > 0) {
          enqueue(pixelIndex - 1);
        }

        if (x < width - 1) {
          enqueue(pixelIndex + 1);
        }

        if (y > 0) {
          enqueue(pixelIndex - width);
        }

        if (y < height - 1) {
          enqueue(pixelIndex + width);
        }
      }

      context.putImageData(imageData, 0, 0);

      return canvas.toDataURL("image/png");
    }

    async function loadProcessedImage(key) {
      if (processedImageCache.has(key)) {
        return processedImageCache.get(key);
      }

      const promise = (async () => {
        const rawImage = await loadRawImage(key);

        if (!rawImage) {
          return null;
        }

        try {
          const processedImage = new Image();
          processedImage.src = removeConnectedWhiteBackground(rawImage);

          if (processedImage.decode) {
            try {
              await processedImage.decode();
            } catch {
              /*
                srcが使えるため続行。
              */
            }
          }

          return processedImage;
        } catch {
          return rawImage;
        }
      })();

      processedImageCache.set(key, promise);
      return promise;
    }

    function recordItemShown() {

    function isCorrectAiAction(action, item) {
      if (item.category === "bad") {
        return action === "skip";
      }

      return action === "eat";
    }

    function recordAiAction(action, item) {
      if (aiState.finished || !item || aiState.currentItemRecorded) {
        return;
      }

      const reactionMs = Math.max(0, performance.now() - aiState.itemShownAt);

      aiState.reactionTimes.push(reactionMs);
      aiState.responses += 1;
      aiState.currentItemRecorded = true;

      if (isCorrectAiAction(action, item)) {
        aiState.correctDecisions += 1;
      } else {
        aiState.mistakes += 1;
      }
    }

    function calculateMedian(values) {
      if (values.length === 0) {
        return 0;
      }

      const sorted = [...values].sort((a, b) => a - b);
      const middle = Math.floor(sorted.length / 2);

      if (sorted.length % 2 === 1) {
        return sorted[middle];
      }

      return (sorted[middle - 1] + sorted[middle]) / 2;
    }

    function clamp(value, min, max) {
      return Math.min(max, Math.max(min, value));
    }

    /*
      仮AIモデル。
      実データを集めたあとで、係数を差し替える想定。
    */
    function predictReflexAge(metrics) {
      let predictedAge = 28;

      predictedAge += (metrics.avgReactionMs - 600) * 0.015;
      predictedAge += (metrics.medianReactionMs - 560) * 0.008;
      predictedAge += (metrics.accuracy - 0.85) * -16;
      predictedAge += (metrics.mistakes - 1) * 1.25;
      predictedAge += (metrics.bowls - 12) * -0.18;
      predictedAge += (metrics.responses - 18) * -0.05;

      return Number(clamp(predictedAge, 5, 90).toFixed(1));
    }

    function finishAiAnalysis() {
      if (aiState.finished) {
        return null;
      }

      aiState.finished = true;

      const reactionTimes = aiState.reactionTimes;

      const avgReactionMs =
        reactionTimes.length > 0
          ? reactionTimes.reduce((sum, value) => sum + value, 0) / reactionTimes.length
          : 1500;

      const medianReactionMs =
        reactionTimes.length > 0
          ? calculateMedian(reactionTimes)
          : 1500;

      const accuracy =
        aiState.responses > 0
          ? aiState.correctDecisions / aiState.responses
          : 0;

      const metrics = {
        avgReactionMs: Number(avgReactionMs.toFixed(1)),
        medianReactionMs: Number(medianReactionMs.toFixed(1)),
        accuracy: Number(accuracy.toFixed(4)),
        mistakes: aiState.mistakes,
        bowls: gameState.totalBowls,
        responses: aiState.responses,
      };

      const predictedAge = predictReflexAge(metrics);
      const difference = Number((predictedAge - aiState.actualAge).toFixed(1));

      return {
        recordedAt: new Date().toISOString(),
        actualAge: aiState.actualAge,
        predictedAge,
        difference,
        ...metrics,
      };
    }

    function formatAiResult(record) {
      if (!record) {
        return "";
      }

      let differenceText = "実年齢と同じくらい";

      if (record.difference < 0) {
        differenceText = `実年齢より ${Math.abs(record.difference)}歳 若い`;
      }

      if (record.difference > 0) {
        differenceText = `実年齢より ${record.difference}歳 高い`;
      }

      return [
        "",
        "【AI反射神経年齢】",
        `実年齢: ${record.actualAge}歳`,
        `予測年齢: ${record.predictedAge}歳`,
        `判定: ${differenceText}`,
        `平均反応時間: ${Math.round(record.avgReactionMs)}ms`,
        `反応時間中央値: ${Math.round(record.medianReactionMs)}ms`,
        `正解率: ${(record.accuracy * 100).toFixed(1)}%`,
        `ミス回数: ${record.mistakes}回`,
        `回答回数: ${record.responses}回`,
        "使用モデル: 仮モデル",
      ].join("\n");
    }

    function downloadAiRecords() {
      const records = loadAiRecords();

      if (records.length === 0) {
        alert("まだ保存できる本番モードの記録がありません。");
        return;
      }

      const lines = [
        [
          "actual_age",
          "avg_reaction_ms",
          "median_reaction_ms",
          "accuracy",
          "mistakes",
          "bowls",
          "responses",
          "predicted_age",
          "difference",
          "recorded_at",
        ].join(","),
      ];

      for (const row of records) {
        lines.push([
          row.actualAge,
          row.avgReactionMs,
          row.medianReactionMs,
          row.accuracy,
          row.mistakes,
          row.bowls,
          row.responses,
          row.predictedAge,
          row.difference,
          row.recordedAt,
        ].join(","));
      }

      const blob = new Blob(
        [
          "\uFEFF" + lines.join("\n"),
        ],
        {
          type: "text/csv;charset=utf-8",
        },
      );

      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");

      link.href = url;
      link.download = "wankosoba_ai_records.csv";

      document.body.append(link);
      link.click();
      link.remove();

      URL.revokeObjectURL(url);
    }

    function updateHud() {

      elements.effectLabel.textContent =

    }

    function chooseWeightedItem() {
      const totalWeight = ITEMS.reduce((sum, item) => sum + item.weight, 0);
      let randomValue = Math.random() * totalWeight;

      for (const item of ITEMS) {
        randomValue -= item.weight;

        if (randomValue <= 0) {
          return item;
        }
      }

      return ITEMS[ITEMS.length - 1];
    }

    function calculateRequiredClicks(item) {
      if (item.category !== "noodle") {
        return 0;
      }

      if (!gameState.activeEffect) {
        return item.clicks;
      }

      if (gameState.activeEffect.type === "multiply") {
        return item.clicks * gameState.activeEffect.value;
      }

      if (gameState.activeEffect.type === "oneClick") {
        return 1;
      }

      return item.clicks;
    }

    function nextItem() {
      if (!gameState.running || gameState.gameOver) {
        return;
      }

      gameState.currentItem = chooseWeightedItem();
      gameState.currentClicks = 0;
      gameState.requiredClicks = calculateRequiredClicks(gameState.currentItem);

      recordItemShown();
      renderCurrentItem();
    }

    async function renderCurrentItem() {
      const item = gameState.currentItem;

      if (!item) {
        return;
      }

      const renderVersion = itemRenderVersion + 1;
      itemRenderVersion = renderVersion;

      let speech = `次は ${item.name}！`;

      if (item.category === "noodle") {
        speech += `\n${gameState.requiredClicks}回クリックで食べる！`;
      } else if (item.category === "bad") {
        speech += "\nこれは食べちゃダメ！";
      } else {
        speech += "\n食べると効果発動！";
      }

      elements.speechText.textContent = speech;

      if (item.category === "noodle") {
        elements.clickProgress.textContent =
          `${gameState.currentClicks} / ${gameState.requiredClicks}`;
      } else if (item.category === "bad") {
        elements.clickProgress.textContent = "食べちゃダメ！";
      } else {
        elements.clickProgress.textContent = "効果アイテム";
      }

      elements.currentItemImage.hidden = true;
      elements.itemFallback.classList.add("hidden");

      const image = await loadProcessedImage(item.key);

      if (renderVersion !== itemRenderVersion || item !== gameState.currentItem) {
        return;
      }

      if (image) {
        elements.currentItemImage.src = image.src;
        elements.currentItemImage.hidden = false;
      } else {
        elements.itemFallback.textContent = item.name;
        elements.itemFallback.classList.remove("hidden");
      }
    }

    function eatCurrentItem() {
      if (!gameState.running || gameState.gameOver || !gameState.currentItem) {
        return;
      }

      const item = gameState.currentItem;

      recordAiAction("eat", item);

      if (item.category === "noodle") {
        gameState.currentClicks += 1;

        if (gameState.currentClicks >= gameState.requiredClicks) {
          eatNoodleSuccessfully();
          return;
        }

        renderCurrentItem();
        return;
      }

      if (item.category === "bad") {
        handleBadItem(item);
        return;
      }

      applyEffect(item);
      nextItem();
    }

    function skipCurrentItem() {
      if (!gameState.running || gameState.gameOver || !gameState.currentItem) {
        return;
      }

      recordAiAction("skip", gameState.currentItem);

      if (gameState.currentItem.category === "bad") {
        showFloatingMessage("回避成功！");
      } else {
        showFloatingMessage(`${gameState.currentItem.name}を見送った`);
      }

      nextItem();
    }

    function eatNoodleSuccessfully() {
      gameState.totalBowls += 1;
      gameState.bowlsSinceMinigame += 1;

      appendLeftBowl();
      reduceEffectTurn();
      updateHud();

      if (gameState.bowlsSinceMinigame >= SETTINGS.bowlsToTriggerMinigame) {
        gameState.bowlsSinceMinigame = 0;
        startMinigame();
        return;

      nextItem();

    async function appendLeftBowl() {
      const slot = document.createElement("div");
      slot.className = "bowl-slot";
      elements.leftBowlStack.append(slot);

      const image = await loadProcessedImage("bowl");

      if (image) {
        const imageElement = document.createElement("img");
        imageElement.src = image.src;
        imageElement.alt = "お椀";
        slot.append(imageElement);
      } else {
        slot.textContent = "🥣";

      while (elements.leftBowlStack.children.length > 45) {
        elements.leftBowlStack.firstElementChild.remove();
      }

    function removeLeftBowls(count) {
      for (let index = 0; index < count; index += 1) {
        elements.leftBowlStack.lastElementChild?.remove();
      }
    }

    function reduceEffectTurn() {
      if (!gameState.activeEffect) {
        return;
      }

      gameState.effectTurnsLeft -= 1;

      if (gameState.effectTurnsLeft <= 0) {
        gameState.activeEffect = null;
        gameState.effectTurnsLeft = 0;
      }
    }

    function handleBadItem(item) {
      if (item.penalty === "gameOver") {
        finishGame("ダークマターを食べてしまった……");
        return;
      }

      if (item.penalty === "minusBowls") {
        const lostBowls = Math.min(3, gameState.totalBowls);
        gameState.totalBowls -= lostBowls;

        removeLeftBowls(lostBowls);

        showFloatingMessage(`岩を食べた！ お椀が${lostBowls}個減った！`);

        updateHud();
        nextItem();
      }
    }

    function applyEffect(item) {
      if (item.effectType === "multiply") {
        gameState.activeEffect = {
          type: "multiply",
          value: item.effectValue,
          label: `${item.name}: クリック×${item.effectValue}`,
        };

        gameState.effectTurnsLeft = SETTINGS.effectTurns;

        showFloatingMessage(
          `${item.name}発動！ 次の${SETTINGS.effectTurns}皿はクリック×${item.effectValue}`,
        );

        updateHud();
        return;
      }

      if (item.effectType === "oneClick") {
        gameState.activeEffect = {
          type: "oneClick",
          value: 1,
          label: `${item.name}: 全部1回`,
        };

        gameState.effectTurnsLeft = SETTINGS.effectTurns;

        showFloatingMessage(
          `${item.name}発動！ 次の${SETTINGS.effectTurns}皿は全部1回`,
        );

        updateHud();
      }
    }

    async function startMinigame() {
      gameState.paused = true;
      gameState.running = false;

      cancelAnimationFrame(timerAnimationId);

      gameState.timeLeft = Math.max(
        0,
        (gameState.endTimestamp - performance.now()) / 1000,
      );

      stopMinigameAnimation();

      minigameState.active = true;
      minigameState.phase = "idle";
      minigameState.currentIndex = 0;
      minigameState.stackedCount = 0;
      minigameState.bonusSeconds = 0;
      minigameState.bowlImage = await loadProcessedImage("bowl");

      /*
        ミニゲームの成功範囲をここで確定。
        青い範囲の中央と、中心線のX座標を完全に一致させる。
      */
      minigameState.successCenterX = elements.minigameCanvas.width / 2;
      minigameState.successLeftX =
        minigameState.successCenterX - SETTINGS.minigameGoodRange;
      minigameState.successRightX =
        minigameState.successCenterX + SETTINGS.minigameGoodRange;

      minigameState.moveLeftX = 210;
      minigameState.moveRightX = 790;

      elements.dropButton.textContent = "落とす";

      showScreen("minigame");

      spawnMinigameBowl();
    }

    function spawnMinigameBowl() {
      if (!minigameState.active) {
        return;
      }

      if (minigameState.currentIndex >= SETTINGS.minigameBowls) {
        finishMinigame();
        return;
      }

      minigameState.currentIndex += 1;
      minigameState.bowlY = 145;

      const speedIndex =
        Math.floor(Math.random() * SETTINGS.minigameSpeedChoices.length);

      minigameState.moveSpeed = SETTINGS.minigameSpeedChoices[speedIndex];

      const startsFromLeft = Math.random() < 0.5;

      if (startsFromLeft) {
        minigameState.bowlX = minigameState.moveLeftX;
      } else {
        minigameState.bowlX = minigameState.moveRightX;
        minigameState.moveSpeed *= -1;
      }

      minigameState.phase = "moving";

      animateMinigame();
    }

    function animateMinigame() {
      if (!minigameState.active) {
        return;
      }

      if (minigameState.phase === "moving") {
        minigameState.bowlX += minigameState.moveSpeed;

        if (minigameState.bowlX <= minigameState.moveLeftX) {
          minigameState.bowlX = minigameState.moveLeftX;
          minigameState.moveSpeed = Math.abs(minigameState.moveSpeed);
        }

        if (minigameState.bowlX >= minigameState.moveRightX) {
          minigameState.bowlX = minigameState.moveRightX;
          minigameState.moveSpeed = -Math.abs(minigameState.moveSpeed);
        }
      }

      if (minigameState.phase === "dropping") {
        minigameState.bowlY += SETTINGS.minigameDropSpeed;

        const landingY = 595 - minigameState.stackedCount * 34;

        if (minigameState.bowlY >= landingY) {
          minigameState.bowlY = landingY;
          checkMinigameLanding();
          return;
        }
      }

      drawMinigame();

      minigameAnimationId = requestAnimationFrame(animateMinigame);
    }

    function dropMinigameBowl() {
      if (!minigameState.active || minigameState.phase !== "moving") {
        return;
      }

      minigameState.phase = "dropping";
    }

    function checkMinigameLanding() {
      minigameState.phase = "waiting";

      /*
        青い範囲内なら成功。
        中心線だけではなく、successLeftX〜successRightXの間を成功にする。
      */
      const succeeded =
        minigameState.bowlX >= minigameState.successLeftX
        && minigameState.bowlX <= minigameState.successRightX;

      if (succeeded) {
        minigameState.stackedCount += 1;
      }

      drawMinigame(
        succeeded
          ? "成功！"
          : "ずれた！",
      );

      minigameSpawnTimerId = window.setTimeout(
        spawnMinigameBowl,
        480,
      );
    }

    function drawMinigame(message = "") {
      const canvas = elements.minigameCanvas;
      const context = canvas.getContext("2d");

      const centerX = minigameState.successCenterX;
      const leftX = minigameState.successLeftX;
      const rightX = minigameState.successRightX;
      const rangeWidth = rightX - leftX;

      context.clearRect(0, 0, canvas.width, canvas.height);

      context.fillStyle = "#d8f2ff";
      context.fillRect(0, 0, canvas.width, canvas.height);

      context.fillStyle = "#203040";
      context.textAlign = "center";
      context.font = "bold 42px sans-serif";
      context.fillText("ミニゲーム：お椀をまっすぐ落とせ！", centerX, 62);

      context.font = "bold 22px sans-serif";
      context.fillText("青い範囲内にお椀が来た瞬間に「落とす」を押す", centerX, 104);

      context.textAlign = "left";
      context.font = "bold 27px sans-serif";
      context.fillText(
        `${minigameState.currentIndex}/${SETTINGS.minigameBowls}`,
        72,
        155,
      );

      context.font = "bold 22px sans-serif";
      context.fillText(`成功: ${minigameState.stackedCount}個`, 72, 190);

      /*
        青の成功範囲。
        この範囲内なら成功。
      */
      context.fillStyle = "rgba(76, 124, 255, 0.16)";
      context.fillRect(leftX, 130, rangeWidth, 485);

      /*
        成功範囲の両端も薄く表示。
      */
      context.strokeStyle = "rgba(76, 124, 255, 0.55)";
      context.lineWidth = 2;
      context.setLineDash([5, 5]);

      context.beginPath();
      context.moveTo(leftX, 130);
      context.lineTo(leftX, 615);
      context.stroke();

      context.beginPath();
      context.moveTo(rightX, 130);
      context.lineTo(rightX, 615);
      context.stroke();

      /*
        中心線。
        青い範囲の正確な中心。
      */
      context.strokeStyle = "#4b7cff";
      context.lineWidth = 3;
      context.setLineDash([9, 7]);
      context.beginPath();
      context.moveTo(centerX, 130);
      context.lineTo(centerX, 615);
      context.stroke();
      context.setLineDash([]);

      /*
        積む台。
      */
      context.fillStyle = "#7b4a24";
      context.fillRect(300, 615, 400, 22);

      /*
        積み上がったお椀。
      */
      for (let index = 0; index < minigameState.stackedCount; index += 1) {
        const y = 590 - index * 34;
        drawMinigameBowl(context, centerX, y);
      }

      /*
        現在動いているお椀。
      */
      if (minigameState.phase !== "waiting") {
        drawMinigameBowl(
          context,
          minigameState.bowlX,
          minigameState.bowlY,
        );
      }

      if (message) {
        context.fillStyle = "#203040";
        context.textAlign = "center";
        context.font = "bold 34px sans-serif";
        context.fillText(message, centerX, 240);
      }
    }

    function drawMinigameBowl(context, x, y) {
      const image = minigameState.bowlImage;

      if (image) {
        const width = 175;
        const height = 104;

        context.drawImage(
          image,
          x - width / 2,
          y - height / 2,
          width,
          height,
        );

        return;
      }

      context.fillStyle = "#fff4cf";
      context.strokeStyle = "#4b2e16";
      context.lineWidth = 3;

      context.beginPath();
      context.ellipse(x, y, 68, 20, 0, 0, Math.PI * 2);
      context.fill();
      context.stroke();
    }

    function calculateMinigameBonus() {
      if (minigameState.stackedCount === 10) {
        return 20;
      }

      if (minigameState.stackedCount >= 5) {
        return minigameState.stackedCount + 5;
      }

      return minigameState.stackedCount;
    }

    function finishMinigame() {
      stopMinigameAnimation();

      minigameState.active = false;
      minigameState.phase = "finished";
      minigameState.bonusSeconds = calculateMinigameBonus();

      const canvas = elements.minigameCanvas;
      const context = canvas.getContext("2d");

      context.clearRect(0, 0, canvas.width, canvas.height);

      context.fillStyle = "#d8f2ff";
      context.fillRect(0, 0, canvas.width, canvas.height);

      context.fillStyle = "#fff4cf";
      context.strokeStyle = "#4b2e16";
      context.lineWidth = 4;
      context.fillRect(235, 170, 530, 300);
      context.strokeRect(235, 170, 530, 300);

      context.fillStyle = "#203040";
      context.textAlign = "center";
      context.font = "bold 48px sans-serif";
      context.fillText("ミニゲーム終了！", 500, 245);

      context.font = "bold 30px sans-serif";
      context.fillText(`積めたお椀: ${minigameState.stackedCount}個`, 500, 325);
      context.fillText(`ボーナスタイム: +${minigameState.bonusSeconds}秒`, 500, 375);

      elements.dropButton.textContent = "ゲームに戻る";
    }

    function returnFromMinigame() {
      const bonusSeconds = minigameState.bonusSeconds;
      const stackedCount = minigameState.stackedCount;

      elements.dropButton.textContent = "落とす";

      gameState.paused = false;
      gameState.running = true;
      gameState.timeLeft += bonusSeconds;
      gameState.timeBarMax += bonusSeconds;
      gameState.endTimestamp = performance.now() + gameState.timeLeft * 1000;

      showScreen("game");

      nextItem();

      showFloatingMessage(
        `ミニゲーム: ${stackedCount}個成功！ +${bonusSeconds}秒`,
      );

      updateHud();
      updateTimer();
    }

    function handleDropButton() {
      if (minigameState.phase === "finished") {
        returnFromMinigame();
        return;
      }

      dropMinigameBowl();
    }

    function stopMinigameAnimation() {
      cancelAnimationFrame(minigameAnimationId);
      window.clearTimeout(minigameSpawnTimerId);
    }

    function finishGame(forceMessage = "") {
      if (gameState.gameOver) {
        return;
      }

      gameState.running = false;
      gameState.gameOver = true;

      cancelAnimationFrame(timerAnimationId);

      let resultText = "";

      if (forceMessage) {
        resultText += `${forceMessage}\n`;
      }

      resultText += `あなたの記録: ${gameState.totalBowls}杯`;

      if (gameState.mode === "real") {
        const { rank, total } = addRankingScore(gameState.totalBowls);
        resultText += `\nあなたは ${total}人中 ${rank}位 です。`;
      } else {
        resultText += "\n練習モードなのでランキングには登録されません。";
      }

      const aiRecord = finishAiAnalysis();
      resultText += formatAiResult(aiRecord);

      if (gameState.mode === "real" && aiRecord) {
        saveAiRecord(aiRecord);
      }

      elements.resultMessage.textContent = resultText;

      showScreen("result");
    }

    function stopGameplay() {
      cancelAnimationFrame(timerAnimationId);
      window.clearInterval(countdownTimerId);
      gameState.running = false;
    }

    function loadRanking() {
      try {
        const ranking = JSON.parse(
          localStorage.getItem(SETTINGS.rankingKey) ?? "[]",
        );

        return Array.isArray(ranking) ? ranking : [];
      } catch {
        return [];
      }
    }

    function saveRanking(ranking) {
      localStorage.setItem(
        SETTINGS.rankingKey,
        JSON.stringify(ranking),
      );
    }

    function addRankingScore(score) {
      const ranking = loadRanking();

      const record = {
        id:
          crypto.randomUUID
            ? crypto.randomUUID()
            : `${Date.now()}-${Math.random()}`,
        score,
        createdAt: new Date().toLocaleString("ja-JP"),
      };

      ranking.push(record);
      ranking.sort((a, b) => b.score - a.score);
      saveRanking(ranking);

      const rank =
        ranking.findIndex((row) => row.id === record.id) + 1;

      return {
        rank,
        total: ranking.length,
      };
    }

    function showRanking() {
      const ranking = loadRanking()
        .sort((a, b) => b.score - a.score)
        .slice(0, 10);

      elements.rankingList.replaceChildren();

      if (ranking.length === 0) {
        const item = document.createElement("li");
        item.textContent = "まだ記録がありません。";
        elements.rankingList.append(item);
      } else {
        for (const record of ranking) {
          const item = document.createElement("li");
          item.textContent = `${record.score}杯　${record.createdAt}`;
          elements.rankingList.append(item);
        }
      }

      showScreen("ranking");
    }

    document
      .querySelector("#practice-menu-button")
      .addEventListener("click", startPracticeExplanation);

    document
      .querySelector("#real-menu-button")
      .addEventListener("click", () => {
        startGame("real");
      });

    document
      .querySelector("#ranking-menu-button")
      .addEventListener("click", showRanking);

    document
      .querySelector("#practice-next-button")
      .addEventListener("click", nextPracticeMessage);

    document
      .querySelector("#practice-back-button")
      .addEventListener("click", showTitle);

    document
      .querySelector("#eat-button")
      .addEventListener("click", eatCurrentItem);

    document
      .querySelector("#skip-button")
      .addEventListener("click", skipCurrentItem);

    document
      .querySelector("#drop-button")
      .addEventListener("click", handleDropButton);

    document
      .querySelector("#retry-button")
      .addEventListener("click", () => {
        startGame(gameState.mode);
      });

    document
      .querySelector("#result-ranking-button")
      .addEventListener("click", showRanking);

    document
      .querySelector("#result-title-button")
      .addEventListener("click", showTitle);

    document
      .querySelector("#ranking-back-button")
      .addEventListener("click", showTitle);

    document
      .querySelector("#download-ai-data-button")
      .addEventListener("click", downloadAiRecords);

    document
      .querySelector("#clear-ai-data-button")
      .addEventListener("click", clearAiRecords);

    window.addEventListener("keydown", (event) => {
      if (event.code !== "Space") {
        return;
      }

      if (!screens.minigame.classList.contains("active")) {
        return;
      }

      event.preventDefault();
      handleDropButton();
    });

    initialiseStaticImages();
    showTitle();
  </script>
</body>
</html>
