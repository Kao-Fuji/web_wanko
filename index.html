  <style>

    .screen-title{position:relative;z-index:3;margin-top:36px;text-align:center;font-size:clamp(34px,5vw,48px)}.guide{position:absolute;z-index:3;top:17%;right:4%;width:min(34%,340px);height:min(68%,470px);object-fit:contain;object-position:center bottom}.practice-card{position:absolute;z-index:4;top:45%;left:13%;width:min(570px,62%);padding:18px;border:3px solid var(--brown);background:var(--paper);font-size:clamp(16px,2.2vw,21px);font-weight:800}.practice-card p{margin:0}.bottom-buttons{position:absolute;z-index:5;bottom:9%;left:50%;display:grid;gap:14px;width:min(240px,52vw);transform:translateX(-50%)}

    .game-main{position:absolute;z-index:5;top:108px;right:260px;bottom:0;left:285px}.speech{position:absolute;top:0;left:50%;width:380px;min-height:92px;padding:13px 18px;border:3px solid var(--brown);background:var(--paper);transform:translateX(-50%)}.speech p{margin:0;white-space:pre-line;font-size:18px;font-weight:800}.food-stage{position:absolute;top:150px;left:50%;display:grid;place-items:center;width:450px;height:270px;overflow:visible;transform:translateX(-50%)}.food{display:block;width:450px;height:290px;object-fit:contain;object-position:center bottom}.fallback{display:grid;place-items:center;width:280px;height:165px;border:3px solid var(--brown);background:var(--paper);font-size:30px;font-weight:800}.progress{position:absolute;top:420px;left:50%;transform:translateX(-50%);font-size:34px;font-weight:900;text-shadow:1px 1px 0 #fff1c8}.game-buttons{position:absolute;top:472px;left:50%;display:grid;gap:11px;width:290px;transform:translateX(-50%)}.game-buttons button{width:100%}

    .countdown{display:none;place-items:center;background:rgba(0,0,0,.84)}.countdown.active{display:grid}.countdown-number{color:#fff;font-size:min(30vw,170px);font-weight:900}.mini{background:var(--sky)}.mini.active{display:block}#mini-canvas{width:100%;height:100%}.drop{position:absolute;bottom:25px;left:50%;width:min(320px,68vw);transform:translateX(-50%);font-size:22px}

<body>
  <main class="app">
    <section id="title" class="screen active">
      <img class="bg" data-asset="background" alt="">
      <div class="shade"></div>

      <div class="title">
        <h1>わんこそば<br>連打ゲーム</h1>

        <p>食べる？ 食べない？ お椀が積もれば時間も積もる。</p>

        <div class="age">
          <label for="age">実年齢</label>
          <input id="age" type="number" min="5" max="99" inputmode="numeric" placeholder="例：21">
        </div>

        <div class="menu">
          <button id="practice-start">練習モード</button>
          <button id="real-start">本番モード</button>
          <button id="ranking-open">ランキング</button>
        </div>

        <div class="ai-buttons">
          <button id="csv">AI学習用CSVを保存</button>
          <button id="ai-clear">AI記録を削除</button>
        </div>

        <p class="ai-note">
          本番モードでは、AIが反応時間・正解率・ミス回数を分析します。
        </p>
      </div>
    </section>

    <section id="practice" class="screen">
      <img class="bg" data-asset="background" alt="">
      <div class="shade light"></div>

      <h2 class="screen-title">練習説明</h2>

      <img class="guide" data-asset="guide" alt="案内役">

      <div class="practice-card">
        <p id="practice-text"></p>
      </div>

      <div class="bottom-buttons">
        <button id="practice-next">次へ</button>
        <button id="practice-back">タイトルへ</button>
      </div>
    </section>

    <section id="game" class="screen">
      <img class="bg" data-asset="background" alt="">
      <div class="shade light"></div>

      <div class="hud">
        <div class="hud-top">
          <span id="mode">モード: 練習</span>
          <span id="bowls">杯数: 0</span>
        </div>

        <div class="time-row">
          <span id="time">残り 10 秒</span>

          <div class="bar">
            <div id="bar-fill"></div>
          </div>
        </div>

        <div id="effect" class="effect">
          効果: なし
        </div>
      </div>

      <aside class="bowl-panel">
        <h3>お椀</h3>

        <div id="bowl-stack" class="bowl-stack"></div>
      </aside>

      <div class="game-main">
        <div class="speech">
          <p id="speech">
            次の食べ物を準備中...
          </p>
        </div>

        <div class="food-stage">
          <img id="food" class="food" alt="">

          <div id="fallback" class="fallback hidden"></div>
        </div>

        <div id="progress" class="progress">
          0 / 1
        </div>

        <div class="game-buttons">
          <button id="eat">食べる</button>
          <button id="skip">食べない</button>
        </div>
      </div>

      <img class="waiter" data-asset="waiter" alt="学部長">

      <div id="float" class="float hidden"></div>
    </section>

    <section id="countdown" class="screen countdown">
      <div id="countdown-number" class="countdown-number">
        3
      </div>
    </section>

    <section id="mini" class="screen mini">
      <canvas id="mini-canvas" width="1000" height="700"></canvas>

      <button id="drop" class="drop">
        落とす
      </button>
    </section>

    <section id="result" class="screen">
      <img class="bg" data-asset="background" alt="">

      <div class="shade strong"></div>

      <div class="card">
        <h2>結果発表</h2>

        <p id="result-text"></p>

        <div class="result-buttons">
          <button id="retry">もう一度</button>
          <button id="result-ranking">ランキング</button>
          <button id="result-title">タイトル</button>
        </div>
      </div>
    </section>

    <section id="ranking" class="screen">
      <img class="bg" data-asset="background" alt="">

      <div class="shade strong"></div>

      <div class="card">
        <h2>ランキング</h2>

        <p>
          この端末で遊んだ本番モードの記録
        </p>

        <ol id="ranking-list" class="ranking-list"></ol>

        <button id="ranking-back">
          タイトルへ
        </button>
      </div>
    </section>
  </main>

  <script>
    "use strict";

    const S = {
      practice: 10,
      real: 30,
      countdown: 3,
      effectTurns: 5,
      trigger: 10,
      miniBowls: 10,

      /*
        成功範囲は中心線から左右54px。
        以前の約3倍。
      */
      halfRange: 54,

      /*
        お椀を出すたびに速度を毎回抽選する。
      */
      speeds: [
        2.5,
        3,
        3.5,
        4,
        4.5,
        5,
        5.5,
        6,
      ],

      dropSpeed: 14,

      rankKey: "wanko-rank-v2",
      aiKey: "wanko-ai-v2",
    };

    const ITEMS = [
      {
        key: "soba",
        name: "そば",
        type: "noodle",
        clicks: 1,
        w: 25,
      },

      {
        key: "udon",
        name: "うどん",
        type: "noodle",
        clicks: 3,
        w: 18,
      },

      {
        key: "ramen",
        name: "中華麺",
        type: "noodle",
        clicks: 5,
        w: 14,
      },

      {
        key: "houtou",
        name: "ほうとう",
        type: "noodle",
        clicks: 10,
        w: 8,
      },

      {
        key: "dark_matter",
        name: "ダークマター",
        type: "bad",
        penalty: "over",
        w: 6,
      },

      {
        key: "rock",
        name: "岩",
        type: "bad",
        penalty: "minus",
        w: 7,
      },

      {
        key: "rock_salt",
        name: "岩塩",
        type: "effect",
        effect: "multiply",
        value: 2,
        w: 7,
      },

      {
        key: "moss",
        name: "苔",
        type: "effect",
        effect: "multiply",
        value: 3,
        w: 5,
      },

      {
        key: "yakumi",
        name: "薬味",
        type: "effect",
        effect: "one",
        value: 1,
        w: 10,
      },
    ];

    const C = {
      background: [
        "background",
      ],

      bowl: [
        "bowl_transparent",
        "bowl",
      ],

      waiter: [
        "waiter_transparent",
        "waiter",
      ],

      guide: [
        "guide_transparent",
        "guide",
      ],

      soba: [
        "soba_transparent",
        "soba",
      ],

      udon: [
        "udon_transparent",
        "udon",
      ],

      ramen: [
        "ramen_transparent",
        "ramen",
      ],

      houtou: [
        "houtou_transparent",
        "houtou",
      ],

      dark_matter: [
        "dark_matter_transparent",
        "dark_matter",
      ],

      rock: [
        "rock_transparent",
        "rock",
      ],

      rock_salt: [
        "rock_salt_transparent",
        "rock_salt",
      ],

      moss: [
        "moss_transparent",
        "moss",
      ],

      yakumi: [
        "yakumi_transparent",
        "yakumi",
      ],
    };

    const EXT = [
      ".png",
      ".jpg",
      ".jpeg",
      ".webp",
    ];

    const raw = new Map();
    const processed = new Map();

    const $ =
      (
        selector,
      ) => {
        return document.querySelector(
          selector,
        );
      };

    const screens = {
      title:
        $("#title"),

      practice:
        $("#practice"),

      game:
        $("#game"),

      countdown:
        $("#countdown"),

      mini:
        $("#mini"),

      result:
        $("#result"),

      ranking:
        $("#ranking"),
    };

    const el = {
      practiceText:
        $("#practice-text"),

      practiceNext:
        $("#practice-next"),

      mode:
        $("#mode"),

      bowls:
        $("#bowls"),

      time:
        $("#time"),

      bar:
        $("#bar-fill"),

      effect:
        $("#effect"),

      stack:
        $("#bowl-stack"),

      speech:
        $("#speech"),

      food:
        $("#food"),

      fallback:
        $("#fallback"),

      progress:
        $("#progress"),

      float:
        $("#float"),

      countdown:
        $("#countdown-number"),

      result:
        $("#result-text"),

      ranking:
        $("#ranking-list"),

      canvas:
        $("#mini-canvas"),

      drop:
        $("#drop"),
    };

    function paths(
      key,
    ) {
      const out =
        [];

      for (
        const name
        of (
          C[
            key
          ]
          || [
            key,
          ]
        )
      ) {
        for (
          const extension
          of EXT
        ) {
          out.push(
            name
            + extension,
          );
        }
      }

      return out;
    }

    function loadRaw(
      key,
    ) {
      if (
        raw.has(
          key,
        )
      ) {
        return raw.get(
          key,
        );
      }

      const promise =
        new Promise(
          (
            resolve,
          ) => {
            const list =
              paths(
                key,
              );

            let index =
              0;

            const next =
              () => {
                if (
                  index
                  >= list.length
                ) {
                  resolve(
                    null,
                  );

                  return;
                }

                const image =
                  new Image();

                image.onload =
                  () => {
                    resolve(
                      image,
                    );
                  };

                image.onerror =
                  next;

                image.src =
                  list[
                    index
                  ];

                index +=
                  1;
              };

            next();
          },
        );

      raw.set(
        key,
        promise,
      );

      return promise;
    }

    /*
      画像の端からつながっている白色だけを消す。
      内側の白色はなるべく残す。
    */
    function removeWhite(
      image,
    ) {
      const maxSide =
        1400;

      const scale =
        Math.min(
          1,

          maxSide
          / Math.max(
            image.naturalWidth,
            image.naturalHeight,
          ),
        );

      const width =
        Math.max(
          1,

          Math.round(
            image.naturalWidth
            * scale,
          ),
        );

      const height =
        Math.max(
          1,

          Math.round(
            image.naturalHeight
            * scale,
          ),
        );

      const canvas =
        document.createElement(
          "canvas",
        );

      canvas.width =
        width;

      canvas.height =
        height;

      const context =
        canvas.getContext(
          "2d",

          {
            willReadFrequently:
              true,
          },
        );

      context.drawImage(
        image,
        0,
        0,
        width,
        height,
      );

      const data =
        context.getImageData(
          0,
          0,
          width,
          height,
        );

      const pixels =
        data.data;

      const seen =
        new Uint8Array(
          width
          * height,
        );

      const queue =
        new Int32Array(
          width
          * height,
        );

      let head =
        0;

      let tail =
        0;

      const isWhite =
        (
          pixelIndex,
        ) => {
          const offset =
            pixelIndex
            * 4;

          const red =
            pixels[
              offset
            ];

          const green =
            pixels[
              offset + 1
            ];

          const blue =
            pixels[
              offset + 2
            ];

          const alpha =
            pixels[
              offset + 3
            ];

          return (
            alpha > 0
            && red >= 232
            && green >= 232
            && blue >= 232
            && Math.max(
              red,
              green,
              blue,
            )
              - Math.min(
                red,
                green,
                blue,
              )
              <= 42
          );
        };

      const add =
        (
          pixelIndex,
        ) => {
          if (
            pixelIndex < 0
            || pixelIndex
              >= width
              * height
            || seen[
              pixelIndex
            ]
            || !isWhite(
              pixelIndex,
            )
          ) {
            return;
          }

          seen[
            pixelIndex
          ] =
            1;

          queue[
            tail
          ] =
            pixelIndex;

          tail +=
            1;
        };

      for (
        let x = 0;
        x < width;
        x += 1
      ) {
        add(
          x,
        );

        add(
          (
            height - 1
          )
          * width
          + x,
        );
      }

      for (
        let y = 0;
        y < height;
        y += 1
      ) {
        add(
          y
          * width,
        );

        add(
          y
          * width
          + width
          - 1,
        );
      }

      while (
        head
        < tail
      ) {
        const pixelIndex =
          queue[
            head
          ];

        head +=
          1;

        pixels[
          pixelIndex
          * 4
          + 3
        ] =
          0;

        const x =
          pixelIndex
          % width;

        const y =
          Math.floor(
            pixelIndex
            / width,
          );

        if (
          x > 0
        ) {
          add(
            pixelIndex
            - 1,
          );
        }

        if (
          x
          < width - 1
        ) {
          add(
            pixelIndex
            + 1,
          );
        }

        if (
          y > 0
        ) {
          add(
            pixelIndex
            - width,
          );
        }

        if (
          y
          < height - 1
        ) {
          add(
            pixelIndex
            + width,
          );
        }
      }

      context.putImageData(
        data,
        0,
        0,
      );

      return canvas.toDataURL(
        "image/png",
      );
    }

    async function loadProcessed(
      key,
    ) {
      if (
        processed.has(
          key,
        )
      ) {
        return processed.get(
          key,
        );
      }

      const promise =
        (
          async () => {
            const image =
              await loadRaw(
                key,
              );

            if (
              !image
            ) {
              return null;
            }

            try {
              const output =
                new Image();

              output.src =
                removeWhite(
                  image,
                );

              if (
                output.decode
              ) {
                try {
                  await output.decode();
                }

                catch {
                  /*
                    srcは使えるので続行。
                  */
                }
              }

              return output;
            }

            catch {
              return image;
            }
          }
        )();

      processed.set(
        key,
        promise,
      );

      return promise;
    }

    async function initImages() {
      const imageElements =
        document.querySelectorAll(
          "img[data-asset]",
        );

      for (
        const node
        of imageElements
      ) {
        const key =
          node.dataset.asset;

        const image =
          key === "background"
            ? await loadRaw(
                key,
              )
            : await loadProcessed(
                key,
              );

        if (
          image
        ) {
          node.src =
            image.src;

          node.hidden =
            false;
        }

        else {
          node.hidden =
            true;
        }
      }
    }

    function shown() {

    function record(
      action,
      item,
    ) {
      if (
        AI.finished
        || !item
        || AI.recorded
      ) {
        return;
      }

      AI.times.push(
        Math.max(
          0,

          performance.now()
          - AI.shownAt,
        ),
      );

      AI.responses +=
        1;

      AI.recorded =
        true;

      const correct =
        item.type
        === "bad"
          ? action
            === "skip"
          : action
            === "eat";

      if (
        correct
      ) {
        AI.correct +=
          1;
      }

      else {
        AI.mistakes +=
          1;
      }
    }

    const clamp =
      (
        value,
        min,
        max,
      ) => {
        return Math.min(
          max,

          Math.max(
            min,
            value,
          ),
        );
      };

    function median(
      values,
    ) {
      if (
        !values.length
      ) {
        return 0;
      }

      const sorted =
        [
          ...values,
        ]
          .sort(
            (
              a,
              b,
            ) => {
              return (
                a - b
              );
            },
          );

      const middle =
        Math.floor(
          sorted.length
          / 2,
        );

      return sorted.length
      % 2
        ? sorted[
            middle
          ]
        : (
            sorted[
              middle - 1
            ]
            + sorted[
              middle
            ]
          )
          / 2;
    }

    /*
      現在は動作確認用の仮AIモデル。
    */
    function predict(
      metrics,
    ) {
      let result =
        28;

      result +=
        (
          metrics.avg
          - 600
        )
        * 0.015;

      result +=
        (
          metrics.med
          - 560
        )
        * 0.008;

      result +=
        (
          metrics.acc
          - 0.85
        )
        * -16;

      result +=
        (
          metrics.mistakes
          - 1
        )
        * 1.25;

      result +=
        (
          metrics.bowls
          - 12
        )
        * -0.18;

      result +=
        (
          metrics.responses
          - 18
        )
        * -0.05;

      return Number(
        clamp(
          result,
          5,
          90,
        )
          .toFixed(
            1,
          ),
      );
    }

    function finishAI() {
      if (
        AI.finished
      ) {
        return null;
      }

      AI.finished =
        true;

      const average =
        AI.times.length
          ? AI.times.reduce(
              (
                sum,
                value,
              ) => {
                return (
                  sum
                  + value
                );
              },
              0,
            )
            / AI.times.length
          : 1500;

      const middle =
        AI.times.length
          ? median(
              AI.times,
            )
          : 1500;

      const accuracy =
        AI.responses
          ? AI.correct
            / AI.responses
          : 0;

      const metrics = {
        avg:
          Number(
            average.toFixed(
              1,
            ),
          ),

        med:
          Number(
            middle.toFixed(
              1,
            ),
          ),

        acc:
          Number(
            accuracy.toFixed(
              4,
            ),
          ),

        mistakes:
          AI.mistakes,

        bowls:
          G.bowls,

        responses:
          AI.responses,
      };

      const predicted =
        predict(
          metrics,
        );

      return {
        at:
          new Date()
            .toISOString(),

        age:
          AI.age,

        predicted,

        diff:
          Number(
            (
              predicted
              - AI.age
            )
              .toFixed(
                1,
              ),
          ),

        ...metrics,
      };
    }

    function aiText(

      let comparison =

      if (

        comparison =
          (
            `実年齢より `
            + `${Math.abs(
              result.diff,
            )}`
            + `歳 若い`

      }

      if (
        result.diff
        > 0
      ) {
        comparison =
          (
            `実年齢より `
            + `${result.diff}`
            + `歳 高い`
          );
      }

      return [
        "",
        "【AI反射神経年齢】",
        `実年齢: ${result.age}歳`,
        `予測年齢: ${result.predicted}歳`,
        `判定: ${comparison}`,
        `平均反応時間: ${Math.round(result.avg)}ms`,
        `反応時間中央値: ${Math.round(result.med)}ms`,
        `正解率: ${(result.acc * 100).toFixed(1)}%`,
        `ミス回数: ${result.mistakes}回`,
        `回答回数: ${result.responses}回`,
        "使用モデル: 仮モデル",
      ]
        .join(
          "\n",
        );
    }

    function downloadCSV() {
      const records =
        loadAI();

      if (
        !records.length
      ) {
        alert(
          "まだ保存できる本番モードの記録がありません。",
        );

        return;
      }

      const rows = [
        [
          "actual_age",
          "avg_reaction_ms",
          "median_reaction_ms",
          "accuracy",
          "mistakes",
          "bowls",
          "responses",
          "predicted_age",
          "difference",
          "recorded_at",
        ]
          .join(
            ",",
          ),
      ];

      for (
        const record
        of records
      ) {
        rows.push(
          [
            record.age,
            record.avg,
            record.med,
            record.acc,
            record.mistakes,
            record.bowls,
            record.responses,
            record.predicted,
            record.diff,
            record.at,
          ]
            .join(
              ",",
            ),
        );
      }

      const blob =
        new Blob(
          [
            "\uFEFF"
            + rows.join(
              "\n",
            ),
          ],

          {
            type:
              "text/csv;charset=utf-8",
          },
        );

      const url =
        URL.createObjectURL(
          blob,
        );

      const link =
        document.createElement(
          "a",
        );

      link.href =
        url;

      link.download =
        "wankosoba_ai_records.csv";

      document.body.append(
        link,
      );

      link.click();

      link.remove();

      URL.revokeObjectURL(
        url,
      );
    }

    function choose() {
      const total =
        ITEMS.reduce(
          (
            sum,
            item,
          ) => {
            return (
              sum
              + item.w
            );
          },
          0,
        );

      let random =
        Math.random()
        * total;

      for (
        const item
        of ITEMS
      ) {
        random -=
          item.w;

        if (
          random
          <= 0
        ) {
          return item;
        }
      }

      return ITEMS.at(
        -1,
      );
    }

    function required(
      item,
    ) {
      if (
        item.type
        !== "noodle"
      ) {
        return 0;
      }

      if (
        !G.effect
      ) {
        return item.clicks;
      }

      if (
        G.effect.type
        === "multiply"
      ) {
        return (
          item.clicks
          * G.effect.value
        );
      }

      if (
        G.effect.type
        === "one"
      ) {
        return 1;
      }

      return item.clicks;
    }

    function nextItem() {
      if (
        !G.running
        || G.over
      ) {
        return;
      }

      G.item =
        choose();

      G.clicks =
        0;

      G.required =
        required(
          G.item,
        );

      shown();

      renderItem();
    }

    async function renderItem() {
      const item =
        G.item;

      if (
        !item
      ) {
        return;
      }

      const version =
        ++renderVersion;

      el.speech.textContent =
        (
          `次は ${item.name}！\n`
          + (
            item.type
            === "noodle"
              ? `${G.required}回クリックで食べる！`
              : item.type
                === "bad"
                  ? "これは食べちゃダメ！"
                  : "食べると効果発動！"
          )
        );

      el.progress.textContent =
        item.type
        === "noodle"
          ? `${G.clicks} / ${G.required}`
          : item.type
            === "bad"
              ? "食べちゃダメ！"
              : "効果アイテム";

      el.food.hidden =
        true;

      el.fallback.classList.add(
        "hidden",
      );

      const image =
        await loadProcessed(
          item.key,
        );

      if (
        version
          !== renderVersion
        || item
          !== G.item
      ) {
        return;
      }

      if (
        image
      ) {
        el.food.src =
          image.src;

        el.food.hidden =
          false;
      }

      else {
        el.fallback.textContent =
          item.name;

        el.fallback.classList.remove(
          "hidden",
        );
      }
    }

    function eat() {
      if (
        !G.running
        || G.over
        || !G.item
      ) {
        return;
      }

      const item =
        G.item;

      record(
        "eat",
        item,
      );

      if (
        item.type
        === "noodle"
      ) {
        G.clicks +=
          1;

        if (
          G.clicks
          >= G.required
        ) {
          ateNoodle();

          return;
        }

        renderItem();

        return;
      }

      if (
        item.type
        === "bad"
      ) {
        bad(
          item,
        );

        return;
      }

      applyEffect(
        item,
      );

      nextItem();
    }

    function skip() {
      if (
        !G.running
        || G.over
        || !G.item
      ) {
        return;
      }

      record(
        "skip",
        G.item,
      );

      flash(
        G.item.type
        === "bad"
          ? "回避成功！"
          : `${G.item.name}を見送った`,
      );

      nextItem();
    }

    function ateNoodle() {
      G.bowls +=
        1;

      G.sinceMini +=
        1;

      appendBowl();

      reduceEffect();

      hud();

      if (
        G.sinceMini
        >= S.trigger
      ) {
        G.sinceMini =
          0;

        startMini();
      }

      else {
        nextItem();
      }
    }

    async function appendBowl() {
      const slot =
        document.createElement(
          "div",
        );

      slot.className =
        "bowl-slot";

      el.stack.append(
        slot,
      );

      const image =
        await loadProcessed(
          "bowl",
        );

      if (
        image
      ) {
        const bowlImage =
          document.createElement(
            "img",
          );

        bowlImage.src =
          image.src;

        bowlImage.alt =
          "お椀";

        slot.append(
          bowlImage,
        );
      }

      else {
        slot.textContent =
          "🥣";
      }

      while (
        el.stack.children.length
        > 45
      ) {
        el.stack.firstElementChild.remove();
      }
    }

    function removeBowls(
      count,
    ) {
      for (
        let index = 0;
        index < count;
        index += 1
      ) {
        el.stack
          .lastElementChild
          ?.remove();
      }
    }

    function reduceEffect() {
      if (
        !G.effect
      ) {
        return;
      }

      G.effectLeft -=
        1;

      if (
        G.effectLeft
        <= 0
      ) {
        G.effect =
          null;

        G.effectLeft =
          0;
      }
    }

    function bad(
      item,
    ) {
      if (
        item.penalty
        === "over"
      ) {
        finishGame(
          "ダークマターを食べてしまった……",
        );

        return;
      }

      const lost =
        Math.min(
          3,
          G.bowls,
        );

      G.bowls -=
        lost;

      removeBowls(
        lost,
      );

      flash(
        `岩を食べた！ お椀が${lost}個減った！`,
      );

      hud();

      nextItem();
    }

    function applyEffect(
      item,
    ) {
      G.effect =
        item.effect
        === "multiply"
          ? {
              type:
                "multiply",

              value:
                item.value,

              label:
                `${item.name}: クリック×${item.value}`,
            }
          : {
              type:
                "one",

              value:
                1,

              label:
                `${item.name}: 全部1回`,
            };

      G.effectLeft =
        S.effectTurns;

      flash(
        item.effect
        === "multiply"
          ? `${item.name}発動！ 次の${S.effectTurns}皿はクリック×${item.value}`
          : `${item.name}発動！ 次の${S.effectTurns}皿は全部1回`,
      );

      hud();
    }

    function flash(
      text,
    ) {
      clearTimeout(
        floatId,
      );

      el.float.textContent =
        text;

      el.float.classList.remove(
        "hidden",
      );

      floatId =
        setTimeout(
          () => {
            el.float.classList.add(
              "hidden",

          750,
        );
    }

    /*
      ミニゲーム開始。
      青い帯・中心線・成功判定で同じ座標を使う。
    */
    async function startMini() {
      G.paused =
        true;

      G.running =
        false;

      cancelAnimationFrame(
        timerId,
      );

      G.time =
        Math.max(
          0,

          (
            G.end
            - performance.now()
          )
          / 1000,
        );

      stopMini();

      Object.assign(
        M,

        {
          active:
            true,

          phase:
            "idle",

          index:
            0,

          stacked:
            0,

          bonus:
            0,

          image:
            await loadProcessed(
              "bowl",
            ),
        },
      );

      /*
        canvasの正確な中心。
      */
      M.center =
        el.canvas.width
        / 2;

      /*
        青い範囲は中心から左右54px。
      */
      M.left =
        M.center
        - S.halfRange;

      M.right =
        M.center
        + S.halfRange;

      M.moveLeft =
        210;

      M.moveRight =
        el.canvas.width
        - 210;

      el.drop.textContent =
        "落とす";

      show(
        "mini",
      );

      spawnMini();
    }

    function spawnMini() {
      if (
        !M.active
      ) {
        return;
      }

      if (
        M.index
        >= S.miniBowls
      ) {
        finishMini();

        return;
      }

      M.index +=
        1;

      M.y =
        145;

      /*
        お椀を1個出すたびに、
        毎回速度をランダム抽選する。
      */
      const speed =
        S.speeds[
          Math.floor(
            Math.random()
            * S.speeds.length,
          )
        ];

      const fromLeft =
        Math.random()
        < 0.5;

      M.x =
        fromLeft
          ? M.moveLeft
          : M.moveRight;

      M.speed =
        fromLeft
          ? speed
          : -speed;

      M.lockedX =
        M.x;

      M.phase =
        "moving";

      cancelAnimationFrame(
        miniAnimId,
      );

      animateMini();
    }

    function animateMini() {
      if (
        !M.active
      ) {
        return;
      }

      if (
        M.phase
        === "moving"
      ) {
        M.x +=
          M.speed;

        if (
          M.x
          <= M.moveLeft
        ) {
          M.x =
            M.moveLeft;

          M.speed =
            Math.abs(
              M.speed,
            );
        }

        if (
          M.x
          >= M.moveRight
        ) {
          M.x =
            M.moveRight;

          M.speed =
            -Math.abs(
              M.speed,
            );
        }
      }

      if (
        M.phase
        === "dropping"
      ) {
        /*
          押した瞬間の横位置へ固定。
        */
        M.x =
          M.lockedX;

        M.y +=
          S.dropSpeed;

        const landing =
          595
          - M.stacked
            * 34;

        if (
          M.y
          >= landing
        ) {
          M.y =
            landing;

          judgeMini();

          return;
        }
      }

      drawMini();

      miniAnimId =
        requestAnimationFrame(
          animateMini,
        );
    }

    function dropMini() {
      if (
        !M.active
        || M.phase
          !== "moving"
      ) {
        return;
      }

      /*
        「落とす」を押した瞬間のX位置を保存。
      */
      M.lockedX =
        M.x;

      M.phase =
        "dropping";
    }

    function judgeMini() {
      M.phase =
        "waiting";

      /*
        見えている青い帯の内側なら成功。
      */
      const success =
        M.lockedX
          >= M.left
        && M.lockedX
          <= M.right;

      if (
        success
      ) {
        M.stacked +=
          1;
      }

      drawMini(
        success
          ? "成功！"
          : "ずれた！",
      );

      miniSpawnId =
        setTimeout(
          spawnMini,
          480,
        );
    }

    function drawMini(
      message = "",
    ) {
      const canvas =
        el.canvas;

      const context =
        canvas.getContext(
          "2d",
        );

      const center =
        M.center;

      const left =
        M.left;

      const right =
        M.right;

      context.clearRect(
        0,
        0,
        canvas.width,
        canvas.height,
      );

      context.fillStyle =
        "#d8f2ff";

      context.fillRect(
        0,
        0,
        canvas.width,
        canvas.height,
      );

      context.fillStyle =
        "#203040";

      context.textAlign =
        "center";

      context.font =
        "bold 42px sans-serif";

      context.fillText(
        "ミニゲーム：お椀をまっすぐ落とせ！",
        center,
        62,
      );

      context.font =
        "bold 22px sans-serif";

      context.fillText(
        "青い範囲内にお椀が来た瞬間に「落とす」を押す",
        center,
        104,
      );

      context.textAlign =
        "left";

      context.font =
        "bold 27px sans-serif";

      context.fillText(
        `${M.index}/${S.miniBowls}`,
        72,
        155,
      );

      context.font =
        "bold 22px sans-serif";

      context.fillText(
        `成功: ${M.stacked}個`,
        72,
        190,
      );

      /*
        青い成功範囲。
        判定と同じleft・rightを使う。
      */
      context.fillStyle =
        "rgba(76,124,255,.18)";

      context.fillRect(
        left,
        130,
        right - left,
        485,
      );

      /*
        青い範囲の左右端。
      */
      context.strokeStyle =
        "rgba(76,124,255,.60)";

      context.lineWidth =
        2;

      context.setLineDash([
        5,
        5,
      ]);

      for (
        const edge
        of [
          left,
          right,
        ]
      ) {
        context.beginPath();

        context.moveTo(
          edge,
          130,
        );

        context.lineTo(
          edge,
          615,
        );

        context.stroke();
      }

      /*
        中心線。
        青い範囲の正確な中央。
      */
      context.strokeStyle =
        "#4b7cff";

      context.lineWidth =
        3;

      context.setLineDash([
        9,
        7,
      ]);

      context.beginPath();

      context.moveTo(
        center,
        130,
      );

      context.lineTo(
        center,
        615,
      );

      context.stroke();

      context.setLineDash([]);

      /*
        台。
      */
      context.fillStyle =
        "#7b4a24";

      context.fillRect(
        300,
        615,
        400,
        22,
      );

      /*
        積み上がったお椀。
      */
      for (
        let index = 0;
        index < M.stacked;
        index += 1
      ) {
        drawMiniBowl(
          context,
          center,
          590
            - index
              * 34,
        );
      }

      /*
        操作中のお椀。
      */
      if (
        M.phase
          === "moving"
        || M.phase
          === "dropping"
      ) {
        drawMiniBowl(
          context,
          M.x,
          M.y,
        );
      }

      if (
        message
      ) {
        context.fillStyle =
          "#203040";

        context.textAlign =
          "center";

        context.font =
          "bold 34px sans-serif";

        context.fillText(
          message,
          center,
          240,
        );
      }
    }

    function drawMiniBowl(
      context,
      x,
      y,
    ) {
      if (
        M.image
      ) {
        context.drawImage(
          M.image,
          x - 87.5,
          y - 52,
          175,
          104,
        );

        return;
      }

      context.fillStyle =
        "#fff4cf";

      context.strokeStyle =
        "#4b2e16";

      context.lineWidth =
        3;

      context.beginPath();

      context.ellipse(
        x,
        y,
        68,
        20,
        0,
        0,
        Math.PI * 2,
      );

      context.fill();

      context.stroke();
    }

    function bonus() {
      return M.stacked
      === 10
        ? 20
        : M.stacked
          >= 5
            ? M.stacked
              + 5
            : M.stacked;
    }

    function finishMini() {
      stopMini();

      M.active =
        false;

      M.phase =
        "finished";

      M.bonus =
        bonus();

      const canvas =
        el.canvas;

      const context =
        canvas.getContext(
          "2d",
        );

      context.clearRect(
        0,
        0,
        canvas.width,
        canvas.height,
      );

      context.fillStyle =
        "#d8f2ff";

      context.fillRect(
        0,
        0,
        canvas.width,
        canvas.height,
      );

      context.fillStyle =
        "#fff4cf";

      context.strokeStyle =
        "#4b2e16";

      context.lineWidth =
        4;

      context.fillRect(
        235,
        170,
        530,
        300,
      );

      context.strokeRect(
        235,
        170,
        530,
        300,
      );

      context.fillStyle =
        "#203040";

      context.textAlign =
        "center";

      context.font =
        "bold 48px sans-serif";

      context.fillText(
        "ミニゲーム終了！",
        500,
        245,
      );

      context.font =
        "bold 30px sans-serif";

      context.fillText(
        `積めたお椀: ${M.stacked}個`,
        500,
        325,
      );

      context.fillText(
        `ボーナスタイム: +${M.bonus}秒`,
        500,
        375,
      );

      el.drop.textContent =
        "ゲームに戻る";
    }

    function backFromMini() {
      const added =
        M.bonus;

      const stacked =
        M.stacked;

      el.drop.textContent =
        "落とす";

      G.paused =
        false;

      G.running =
        true;

      G.time +=
        added;

      G.maxTime +=
        added;

      G.end =
        performance.now()
        + G.time
          * 1000;

      show(
        "game",
      );

      nextItem();

      flash(
        `ミニゲーム: ${stacked}個成功！ +${added}秒`,
      );

      hud();

      tick();
    }

    function handleDrop() {
      if (
        M.phase
        === "finished"
      ) {
        backFromMini();

        return;
      }

      dropMini();
    }

    function stopMini() {
      cancelAnimationFrame(
        miniAnimId,
      );

      clearTimeout(
        miniSpawnId,
      );
    }

    function finishGame(
      message = "",
    ) {
      if (
        G.over
      ) {
        return;
      }

      G.running =
        false;

      G.over =
        true;

      cancelAnimationFrame(
        timerId,
      );

      let text =
        message
          ? message
            + "\n"
          : "";

      text +=
        `あなたの記録: ${G.bowls}杯`;

      if (
        G.mode
        === "real"
      ) {
        const {
          rank,
          total,
        } =
          addRank(
            G.bowls,
          );

        text +=
          `\nあなたは ${total}人中 ${rank}位 です。`;
      }

      else {
        text +=
          "\n練習モードなのでランキングには登録されません。";
      }

      const result =
        finishAI();

      text +=
        aiText(
          result,
        );

      if (
        G.mode
          === "real"
        && result
      ) {
        saveAI(
          result,
        );
      }

      el.result.textContent =
        text;

      show(
        "result",
      );
    }

    function stopGame() {
      cancelAnimationFrame(
        timerId,
      );

      clearInterval(
        countdownId,
      );

      G.running =
        false;
    }

    function loadRanks() {
      try {
        const ranking =
          JSON.parse(
            localStorage.getItem(
              S.rankKey,
            )
            || "[]",
          );

        return Array.isArray(
          ranking,
        )
          ? ranking
          : [];
      }

      catch {
        return [];
      }
    }

    function saveRanks(
      ranking,
    ) {
      localStorage.setItem(
        S.rankKey,

        JSON.stringify(
          ranking,
        ),
      );
    }

    function addRank(
      score,
    ) {
      const ranking =
        loadRanks();

      const record = {
        id:
          globalThis
            .crypto
            ?.randomUUID
            ?.()
          || (
            `${Date.now()}`
            + `-`
            + `${Math.random()}`
          ),

        score,

        at:
          new Date()
            .toLocaleString(
              "ja-JP",
            ),
      };

      ranking.push(
        record,
      );

      ranking.sort(
        (
          a,
          b,
        ) => {
          return (
            b.score
            - a.score
          );
        },
      );

      saveRanks(
        ranking,
      );

      return {
        rank:
          ranking.findIndex(
            (
              item,
            ) => {
              return (
                item.id
                === record.id
              );
            },
          )
          + 1,

        total:
          ranking.length,
      };
    }

    function openRanking() {
      const ranking =
        loadRanks()
          .sort(
            (
              a,
              b,
            ) => {
              return (
                b.score
                - a.score
              );
            },
          )
          .slice(
            0,
            10,
          );

      el.ranking
        .replaceChildren();

      if (
        !ranking.length
      ) {
        const item =
          document.createElement(
            "li",
          );

        item.textContent =
          "まだ記録がありません。";

        el.ranking.append(
          item,
        );
      }

      else {
        for (
          const record
          of ranking
        ) {
          const item =
            document.createElement(
              "li",
            );

          item.textContent =
            `${record.score}杯　${record.at}`;

          el.ranking.append(
            item,
          );
        }
      }

      show(
        "ranking",
      );
    }

    function title() {
      stopGame();

      stopMini();

      show(
        "title",
      );
    }

    $("#practice-start")
      .onclick =
        openPractice;

    $("#real-start")
      .onclick =
        () => {
          startGame(
            "real",
          );
        };

    $("#ranking-open")
      .onclick =
        openRanking;

    $("#practice-next")
      .onclick =
        nextTutorial;

    $("#practice-back")
      .onclick =
        title;

    $("#eat")
      .onclick =
        eat;

    $("#skip")
      .onclick =
        skip;

    $("#drop")
      .onclick =
        handleDrop;

    $("#retry")
      .onclick =
        () => {
          startGame(
            G.mode,
          );
        };

    $("#result-ranking")
      .onclick =
        openRanking;

    $("#result-title")
      .onclick =
        title;

    $("#ranking-back")
      .onclick =
        title;

    $("#csv")
      .onclick =
        downloadCSV;

    $("#ai-clear")
      .onclick =
        clearAI;

    /*
      PCではスペースキーでもお椀を落とせる。
    */
    addEventListener(
      "keydown",

      (
        event,
      ) => {
        if (
          event.code
            === "Space"
          && screens
            .mini
            .classList
            .contains(
              "active",
            )
        ) {
          event.preventDefault();

          handleDrop();
        }
      },
    );

    initImages();

    title();
  </script>
</body>
</html>
